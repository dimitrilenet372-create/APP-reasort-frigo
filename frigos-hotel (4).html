<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Frigos">
<meta name="theme-color" content="#0f766e">
<title>Frigos de l'hôtel</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d23;--mu:#6b7280;--bd:#e3e6eb;--ac:#0f766e;--ok:#16a34a;--out:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2027;--tx:#eef0f3;--mu:#9aa3af;--bd:#2b323c;--ac:#2dd4bf}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2027;--tx:#eef0f3;--mu:#9aa3af;--bd:#2b323c;--ac:#2dd4bf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:manipulation}
button{font-family:inherit;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tab{padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;font-weight:700}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input{min-width:0;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
.s{width:100%;margin-bottom:10px}
.sum{display:flex;gap:8px;margin-bottom:8px}
.sum div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center;font-size:12px;color:var(--mu)}
.sum b{display:block;font-size:24px}
.btn{border:0;border-radius:12px;padding:13px 16px;background:var(--ac);color:#fff;font-weight:700;font-size:16px}
.addrow{width:100%;margin-bottom:8px}
.g{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);margin:14px 4px 6px}
.item{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.item.ko{border-color:color-mix(in srgb,var(--out) 45%,var(--bd))}
.nm{flex:1;min-width:0}
.n{display:block;font-size:17px;overflow-wrap:anywhere}
.shop{margin-top:3px;border:0;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac)}
.shop.no{background:var(--bg);color:var(--mu)}
.ck{width:42px;height:42px;border-radius:50%;border:3px solid var(--out);background:none;color:#fff;font-size:22px;font-weight:800;flex:none;padding:0}
.ck.on{background:var(--ok);border-color:var(--ok)}
.q{display:flex;align-items:center;gap:4px;flex:none}
.q button{width:38px;height:42px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:22px;line-height:1;padding:0}
.qi{width:52px;height:42px;padding:0;text-align:center;font-weight:800;font-size:18px}
.x{border:0;background:none;color:var(--mu);font-size:22px;padding:4px 4px;flex:none}
.none{color:var(--mu);text-align:center;padding:18px}
.hint{font-size:12px;color:var(--mu);margin:8px 2px}
details{margin-top:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
summary{font-weight:700;font-size:15px}
.row{display:flex;gap:8px;margin-top:10px}
.row input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:4px 4px 4px 12px;font-size:14px}
.chip button{border:0;background:none;color:var(--mu);font-size:18px;padding:0 6px}
.send{margin-top:18px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.lab{font-weight:800;margin-bottom:10px}
.send .btn{display:block;width:100%;text-align:left;margin-top:8px}
.send small{display:block;font-weight:500;font-size:12px;opacity:.85;margin-top:2px}
.wa{background:#25d366;color:#073b1c}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media (hover:hover){.btn:hover,.tab:hover,.q button:hover,.shop:hover{filter:brightness(.95)}.ck:hover{opacity:.8}.x:hover{color:var(--out)}summary{cursor:pointer}}
@media (min-width:960px){
main{max-width:1180px;padding:28px 32px}
h1{font-size:28px;margin-bottom:18px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:start}
.side{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto}
.side details:first-child{margin-top:0}
.send{margin-top:12px}
.item{padding:10px 14px}
.n{font-size:18px}
}
</style>
</head>
<body>
<main>
<h1>🧊 Frigos de l'hôtel</h1>
<div class="layout">
<div class="colmain">
<div class="tabs">
<button class="tab on" data-t="bar">🍹 Frigo bar</button>
<button class="tab" data-t="cuisine">🍳 Frigo cuisine</button>
</div>
<input class="s" id="s" type="search" placeholder="🔍 Chercher ou ajouter un produit…" autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
<div id="body"></div>
<div class="hint">✓ vert = présent · cercle rouge = à réassortir · touche le chiffre pour le taper · touche 🏪 pour changer de magasin</div>
</div>
<aside class="side">
<details>
<summary>🏪 Gérer les magasins</summary>
<div class="chips" id="chips"></div>
<div class="row"><input id="ns" placeholder="Nouveau magasin…" autocomplete="off"><button class="btn" id="nsb">+</button></div>
</details>
<details>
<summary>⚙️ Numéro WhatsApp (facultatif)</summary>
<div class="row"><input id="tel" type="tel" inputmode="numeric" placeholder="ex. 33612345678"></div>
</details>
<div class="send">
<div class="lab">📲 Envoyer sur WhatsApp</div>
<button class="btn wa" id="sc"></button>
<button class="btn" id="si">📋 Inventaire<small>Ce qu'il y a dans les frigos</small></button>
</div>
</aside>
</div>
</main>
<script>
var KEY='frigos-hotel-v3';
function mk(g,list){return list.map(function(n){return {n:n,g:g,q:0,ok:false,shop:''}})}
function mkq(g,list){return list.map(function(a){return {n:a[0],g:g,q:a[1],ok:a[1]>0,shop:''}})}
var S={
bar:[].concat(
mkq('Sodas & softs',[['Coca zero',10],['Coca',10],['Limonade',10],['Limonade Coclicot',2],['Tonic',10],['Ginger-beer',10],['Cola Pachamama',5],['Perrier',10],['Thé glacé',2]]),
mkq('Jus',[["Jus d'orange",2],['Jus de pomme',3],["Jus d'ananas",2],["Jus d'abricot",3],['Jus de mangue',2],['Jus de framboise',6],['Jus de poire',6]]),
mkq('Lait',[['Lait',6],["Lait d'amande",2]]),
mkq('Bières',[['Bière ambrée',4],['Bière blanche',4],['Bière blonde',4],['Bière blonde bio',2]]),
mkq('Vins & bulles',[['Prosecco',2],['Champagne grande réserve',2],['Vin rosé Minuty',1],['Vin rosé Preignes',1],['Vin blanc Chardonnay',3],['Vin blanc Chablis',3],['Vin blanc Pouilly-Fumé',3],['Vin blanc Coteaux du Layon',3],['Cidre',1]])),
cuisine:[].concat(
mkq('Pâtisserie',[['Flan',2],['Cannelé',0],['Fondant',5],['Brownie',0]]),
mkq('Fromages',[['Comté 18 mois',1],['Saint-Môret',0],['Brie de Meaux',1],["Fourme d'Ambert",1],['Tomme aux fleurs',1]]),
mkq('Charcuterie',[['Jambon Forêt-Noire',1],['Spianata piccante',1],['Pâté de canard',1]]),
mkq('Légumes',[['Salades',1],['Tomates',0],['Carottes',1]])),
shops:['Metro','La Vie Claire'],tel:''};
try{var o=JSON.parse(localStorage.getItem('frigos-hotel-v2')||'null');if(o){S.tel=o.tel||'';if(o.shops)S.shops=o.shops}}catch(e){}
try{var r=localStorage.getItem(KEY);if(r){var p=JSON.parse(r);if(p&&p.bar&&p.cuisine){S=p;if(!S.shops)S.shops=['Metro','La Vie Claire']}}}catch(e){}
var tab='bar',Q={bar:'',cuisine:''},F=[['bar','🍹 Frigo bar'],['cuisine','🍳 Frigo cuisine']];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function norm(t){return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function shopOf(i){return (i.shop&&S.shops.indexOf(i.shop)>=0)?i.shop:''}
function toBuy(){var o=[];F.forEach(function(f){S[f[0]].forEach(function(i){if(!i.ok)o.push(i)})});return o}
var B=document.getElementById('body'),SI=document.getElementById('s');
function render(){
var a=S[tab],q=norm(Q[tab]),ok=a.filter(function(i){return i.ok}).length;
var h='<div class="sum"><div><b style="color:var(--ok)">'+ok+'</b>✓ Présents</div><div><b style="color:var(--out)">'+(a.length-ok)+'</b>À réassortir</div></div>';
if(q&&!a.some(function(i){return norm(i.n)===q}))h+='<button class="btn addrow" data-a="1">+ Ajouter « '+esc(Q[tab].trim())+' »</button>';
var lg=null,n=0;
a.forEach(function(i,k){
if(q&&norm(i.n).indexOf(q)<0)return;
n++;
var g=i.g||'',sh=shopOf(i);
if(g!==lg){if(g||lg!==null)h+='<div class="g">'+esc(g||'Autres')+'</div>';lg=g}
h+='<div class="item'+(i.ok?'':' ko')+'"><button class="ck'+(i.ok?' on':'')+'" data-k="'+k+'" aria-label="Présent">'+(i.ok?'✓':'')+'</button><div class="nm"><span class="n">'+esc(i.n)+'</span><button class="shop'+(sh?'':' no')+'" data-s="'+k+'">🏪 '+esc(sh||'Magasin ?')+'</button></div><div class="q"><button data-m="'+k+'" aria-label="Moins">−</button><input class="qi" type="text" inputmode="numeric" data-i="'+k+'" value="'+i.q+'" aria-label="Quantité"><button data-p="'+k+'" aria-label="Plus">+</button></div><button class="x" data-d="'+k+'" aria-label="Supprimer">×</button></div>';
});
if(!n)h+='<div class="none">Aucun résultat</div>';
var act=document.activeElement,keep=act&&act.classList&&act.classList.contains('qi')?act.dataset.i:null;
B.innerHTML=h;
document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab)});
var c=toBuy().length;
document.getElementById('sc').innerHTML='🛒 Liste de courses<small>'+(c?c+' article'+(c>1?'s':'')+' à racheter, uniquement':'Rien à racheter pour le moment')+'</small>';
}
function renderShops(){
document.getElementById('chips').innerHTML=S.shops.map(function(s,k){return '<span class="chip">'+esc(s)+'<button data-ds="'+k+'" aria-label="Supprimer">×</button></span>'}).join('')||'<span class="hint">Aucun magasin.</span>';
}
function addItem(){
var v=Q[tab].trim();
if(!v||S[tab].some(function(i){return norm(i.n)===norm(v)}))return;
S[tab].push({n:v.charAt(0).toUpperCase()+v.slice(1),g:'',q:0,ok:false,shop:''});
Q[tab]='';SI.value='';save();render();
}
B.onclick=function(e){
var t=e.target.closest('button');if(!t)return;
var a=S[tab],d=t.dataset,i;
if(d.a){addItem();return}
if(d.k!==undefined){i=a[+d.k];i.ok=!i.ok}
else if(d.p!==undefined){i=a[+d.p];i.q++;i.ok=true}
else if(d.m!==undefined){i=a[+d.m];if(i.q>0)i.q--;if(i.q===0)i.ok=false}
else if(d.s!==undefined){i=a[+d.s];var j=S.shops.indexOf(shopOf(i));i.shop=(j+1<S.shops.length)?S.shops[j+1]:''}
else if(d.d!==undefined){a.splice(+d.d,1)}
else return;
save();render();
};
B.addEventListener('focusin',function(e){if(e.target.classList.contains('qi'))e.target.select()});
B.addEventListener('change',function(e){
if(!e.target.classList.contains('qi'))return;
var i=S[tab][+e.target.dataset.i],v=parseInt(String(e.target.value).replace(/\D/g,''),10);
i.q=isNaN(v)?0:Math.min(v,9999);i.ok=i.q>0;
save();render();
});
B.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.classList.contains('qi'))e.target.blur()});
SI.oninput=function(){Q[tab]=SI.value;render()};
SI.onkeydown=function(e){if(e.key==='Enter'){addItem();SI.blur()}};
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){tab=b.dataset.t;SI.value=Q[tab];render()}});
document.getElementById('chips').onclick=function(e){
var t=e.target.closest('button');if(!t)return;
var name=S.shops.splice(+t.dataset.ds,1)[0];
F.forEach(function(f){S[f[0]].forEach(function(i){if(i.shop===name)i.shop=''})});
save();renderShops();render();
};
function addShop(){
var f=document.getElementById('ns'),v=f.value.trim();
if(!v||S.shops.some(function(s){return norm(s)===norm(v)}))return;
S.shops.push(v);f.value='';save();renderShops();render();
}
document.getElementById('nsb').onclick=addShop;
document.getElementById('ns').onkeydown=function(e){if(e.key==='Enter')addShop()};
var tel=document.getElementById('tel');tel.value=S.tel||'';
tel.onchange=function(){S.tel=tel.value.replace(/\D/g,'');save()};
function dateFr(){return new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
function wa(t){
var n=(S.tel||'').replace(/\D/g,'');
var a=document.createElement('a');
a.href='https://wa.me/'+n+'?text='+encodeURIComponent(t);a.target='_blank';a.rel='noopener';
document.body.appendChild(a);a.click();a.remove();
}
document.getElementById('sc').onclick=function(){
var l=toBuy(),t='🛒 *LISTE DE COURSES*\n'+dateFr()+'\n';
if(!l.length){wa(t+'\nRien à racheter 🎉');return}
var groups=S.shops.concat(['']);
groups.forEach(function(s){
var it=l.filter(function(i){return shopOf(i)===s});
if(!it.length)return;
t+='\n🏪 *'+(s?s.toUpperCase():'SANS MAGASIN')+'*\n';
it.forEach(function(i){t+='• '+i.n+(i.q>0?' (reste '+i.q+')':'')+'\n'});
});
t+='\n*Total : '+l.length+' article'+(l.length>1?'s':'')+'*';
wa(t);
};
document.getElementById('si').onclick=function(){
var t='📋 *INVENTAIRE DES FRIGOS*\n'+dateFr()+'\n';
F.forEach(function(f){
var a=S[f[0]],ok=a.filter(function(i){return i.ok}),ko=a.filter(function(i){return !i.ok});
t+='\n'+f[1].toUpperCase().replace(/^(\S+) /,'$1 *')+'*\n';
t+=ok.length+' en stock · '+ko.length+' à réassortir\n';
if(ok.length){
t+='\n✅ *En stock*\n';
var lg=null;
ok.forEach(function(i){
var g=i.g||'';
if(g&&g!==lg)t+='_'+g+'_\n';
lg=g;
t+='• '+i.n+' : '+(i.q>0?'*'+i.q+'*':'✓')+'\n';
});
}
if(ko.length){
t+='\n❌ *À réassortir*\n';
ko.forEach(function(i){t+='• '+i.n+'\n'});
}
});
wa(t.replace(/\s+$/,''));
};
renderShops();render();
</script>
</body>
</html>
