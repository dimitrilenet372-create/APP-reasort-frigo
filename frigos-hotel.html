<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frigos de l'hôtel</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d23;--mu:#6b7280;--bd:#e3e6eb;--ac:#0f766e;--ok:#16a34a;--out:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2027;--tx:#eef0f3;--mu:#9aa3af;--bd:#2b323c;--ac:#2dd4bf}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2027;--tx:#eef0f3;--mu:#9aa3af;--bd:#2b323c;--ac:#2dd4bf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tab{padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;font-weight:600}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sum{display:flex;gap:8px;margin-bottom:8px}
.sum div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center;font-size:12px;color:var(--mu)}
.sum b{display:block;font-size:22px}
.g{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);margin:14px 4px 6px}
.item{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 8px;margin-bottom:6px}
.item .n{flex:1;font-size:16px}
.ck{width:38px;height:38px;border-radius:50%;border:2px solid var(--out);background:none;color:#fff;font-size:20px;font-weight:700;flex:none}
.ck.on{background:var(--ok);border-color:var(--ok)}
.q{display:flex;align-items:center;gap:2px}
.q button{width:34px;height:34px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:20px;line-height:1}
.q span{min-width:26px;text-align:center;font-weight:700;font-size:17px}
.x{border:0;background:none;color:var(--mu);font-size:20px;padding:4px 6px}
.add{display:flex;gap:8px;margin:14px 0}
input{flex:1;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;min-width:0}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:#fff;font-weight:700;font-size:15px}
.wa{width:100%;background:#25d366;color:#073b1c;margin-top:8px;padding:14px}
.hint{font-size:12px;color:var(--mu);margin:6px 0}
</style>
</head>
<body>
<main>
<h1>🧊 Frigos de l'hôtel</h1>
<div class="tabs">
<button class="tab on" data-t="bar">🍹 Frigo bar</button>
<button class="tab" data-t="cuisine">🍳 Frigo cuisine</button>
</div>
<div class="sum" id="sum"></div>
<div id="list"></div>
<div class="add">
<input id="new" placeholder="Ajouter un produit…" autocomplete="off">
<button class="btn" id="addb">+</button>
</div>
<div class="hint">✓ = présent · cercle vide = à réassortir · −/+ pour compter</div>
<input id="tel" type="tel" inputmode="numeric" placeholder="N° WhatsApp (ex. 33612345678) — facultatif">
<button class="btn wa" id="send">📲 Envoyer le rapport sur WhatsApp</button>
</main>
<script>
var KEY='frigos-hotel-v2';
function mk(g,list){return list.map(function(n){return {n:n,g:g,q:0,ok:false}})}
var S={
bar:[].concat(mk('',['Eau','Soda','Bière',"Jus d'orange",'Champagne'])),
cuisine:[].concat(
mk('Poisson',['Saumon fumé']),
mk('Pâtisserie',['Flan','Cannelé','Fondant','Brownie']),
mk('Fromages',['Comté 18 mois','Saint-Môret','Brie de Meaux',"Fourme d'Ambert",'Tomme aux fleurs']),
mk('Charcuterie',['Jambon Forêt-Noire','Spianata piccante','Pâté de canard']),
mk('Légumes',['Salades','Tomates','Carottes'])),
tel:''};
var tab='bar';
try{var r=localStorage.getItem(KEY);if(r){var p=JSON.parse(r);if(p&&p.bar&&p.cuisine)S=p}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function render(){
var a=S[tab],ok=a.filter(function(i){return i.ok}).length;
document.getElementById('sum').innerHTML='<div><b style="color:var(--ok)">'+ok+'</b>✓ Présents</div><div><b style="color:var(--out)">'+(a.length-ok)+'</b>À réassortir</div>';
var h='',lg=null;
a.forEach(function(i,k){
var g=i.g||'';
if(g!==lg){if(g||lg!==null)h+='<div class="g">'+esc(g||'Autres')+'</div>';lg=g}
h+='<div class="item"><button class="ck'+(i.ok?' on':'')+'" data-k="'+k+'">'+(i.ok?'✓':'')+'</button><span class="n">'+esc(i.n)+'</span><div class="q"><button data-m="'+k+'">−</button><span>'+i.q+'</span><button data-p="'+k+'">+</button></div><button class="x" data-d="'+k+'" aria-label="Supprimer">×</button></div>';
});
document.getElementById('list').innerHTML=h||'<div class="hint">Aucun produit.</div>';
document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab)});
}
document.getElementById('list').onclick=function(e){
var t=e.target.closest('button');if(!t)return;var d=t.dataset,a=S[tab],i;
if(d.k!==undefined){i=a[+d.k];i.ok=!i.ok}
else if(d.p!==undefined){i=a[+d.p];i.q++;i.ok=true}
else if(d.m!==undefined){i=a[+d.m];if(i.q>0)i.q--;if(i.q===0)i.ok=false}
else if(d.d!==undefined){a.splice(+d.d,1)}
else return;
save();render();
};
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){tab=b.dataset.t;render()}});
function add(){var f=document.getElementById('new'),v=f.value.trim();if(!v)return;S[tab].push({n:v,g:'',q:0,ok:false});f.value='';save();render()}
document.getElementById('addb').onclick=add;
document.getElementById('new').onkeydown=function(e){if(e.key==='Enter')add()};
var tel=document.getElementById('tel');tel.value=S.tel||'';
tel.onchange=function(){S.tel=tel.value.replace(/\D/g,'');save()};
document.getElementById('send').onclick=function(){
var d=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
var t='🧊 Rapport frigos — '+d+'\n';
[['bar','🍹 Frigo bar'],['cuisine','🍳 Frigo cuisine']].forEach(function(g){
var a=S[g[0]],o=a.filter(function(i){return !i.ok}),k=a.filter(function(i){return i.ok});
t+='\n*'+g[1]+'*\n';
if(o.length)t+='❌ À réassortir : '+o.map(function(i){return i.n}).join(', ')+'\n';
t+='✅ OK : '+(k.length?k.map(function(i){return i.n+(i.q?' ×'+i.q:'')}).join(', '):'—')+'\n';
});
var n=(S.tel||'').replace(/\D/g,'');
var a=document.createElement('a');
a.href='https://wa.me/'+n+'?text='+encodeURIComponent(t);a.target='_blank';a.rel='noopener';
document.body.appendChild(a);a.click();a.remove();
};
render();
</script>
</body>
</html>
